<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Suivi d'habitudes</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: #6d28d9;
      --primary-light: #ede9fe;
      --gray-100: #f3f4f6;
      --gray-200: #e5e7eb;
      --gray-400: #9ca3af;
      --gray-600: #4b5563;
      --gray-900: #111827;
    }

    body {
      background: #ffffff;
      color: var(--gray-900);
      font-family: 'Segoe UI', system-ui, sans-serif;
      padding: 32px 16px 64px;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 4px;
    }

    .page-sub {
      font-size: 0.85rem;
      color: var(--gray-400);
      margin-bottom: 32px;
    }

    /* ── ZONE 1 — Formulaire ── */
    .add-section {
      background: var(--gray-100);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 32px;
      max-width: 680px;
    }

    .add-section h2 {
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--gray-400);
      margin-bottom: 16px;
    }

    .add-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .add-row input[type="text"] {
      flex: 1;
      min-width: 160px;
      border: 1px solid var(--gray-200);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.95rem;
      background: #fff;
      color: var(--gray-900);
      outline: none;
      transition: border-color 0.2s;
    }

    .add-row input[type="text"]:focus { border-color: var(--primary); }

    .color-picker {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .color-swatch {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      border: 3px solid transparent;
      transition: transform 0.15s, border-color 0.15s;
    }

    .color-swatch:hover { transform: scale(1.15); }
    .color-swatch.selected { border-color: var(--gray-900); transform: scale(1.15); }

    .btn-add {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 10px 22px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
      white-space: nowrap;
    }

    .btn-add:hover { opacity: 0.85; }

    .form-error {
      font-size: 0.82rem;
      color: #dc2626;
      margin-top: 10px;
      min-height: 18px;
    }

    /* ── ZONE 2 — Résumé + liste ── */
    .summary {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--gray-600);
      margin-bottom: 20px;
    }

    .summary span {
      color: var(--primary);
      font-weight: 800;
    }

    .habits-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      max-width: 680px;
    }

    @media (min-width: 600px) {
      .habits-grid { grid-template-columns: 1fr 1fr; }
    }

    .habit-card {
      background: #fff;
      border: 1.5px solid var(--gray-200);
      border-radius: 14px;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      transition: box-shadow 0.2s;
    }

    .habit-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.07); }

    .habit-color-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .habit-checkbox {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      border: 2px solid var(--gray-200);
      cursor: pointer;
      flex-shrink: 0;
      appearance: none;
      -webkit-appearance: none;
      transition: background 0.15s, border-color 0.15s;
      position: relative;
    }

    .habit-checkbox:checked {
      background: var(--habit-color, var(--primary));
      border-color: var(--habit-color, var(--primary));
    }

    .habit-checkbox:checked::after {
      content: '';
      position: absolute;
      left: 4px; top: 1px;
      width: 6px; height: 11px;
      border: 2px solid #fff;
      border-top: none; border-left: none;
      transform: rotate(45deg);
    }

    .habit-info {
      flex: 1;
      min-width: 0;
    }

    .habit-name {
      font-weight: 600;
      font-size: 0.95rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .habit-streak {
      font-size: 0.75rem;
      color: var(--gray-400);
      margin-top: 2px;
    }

    .btn-delete {
      background: none;
      border: none;
      color: var(--gray-400);
      cursor: pointer;
      font-size: 1.1rem;
      padding: 4px;
      border-radius: 6px;
      line-height: 1;
      transition: color 0.2s, background 0.2s;
      flex-shrink: 0;
    }

    .btn-delete:hover { color: #dc2626; background: #fee2e2; }

    /* ── ZONE 3 — Calendrier ── */
    .calendar-toggle {
      width: 100%;
      background: none;
      border: none;
      border-top: 1px solid var(--gray-200);
      margin-top: 14px;
      padding-top: 10px;
      font-size: 0.78rem;
      color: var(--gray-400);
      cursor: pointer;
      text-align: left;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .calendar-toggle:hover { color: var(--primary); }

    .calendar-wrap {
      margin-top: 12px;
      display: none;
    }

    .calendar-wrap.open { display: block; }

    .cal-header {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--gray-600);
      margin-bottom: 8px;
      text-transform: capitalize;
    }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 3px;
    }

    .cal-day-label {
      font-size: 0.6rem;
      font-weight: 700;
      color: var(--gray-400);
      text-align: center;
      padding-bottom: 4px;
    }

    .cal-cell {
      aspect-ratio: 1;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.62rem;
      font-weight: 600;
      color: #fff;
    }

    .cal-cell.future { background: var(--gray-200); color: var(--gray-400); }
    .cal-cell.done   { background: #16a34a; }
    .cal-cell.missed { background: #dc2626; }
    .cal-cell.today-done   { background: #16a34a; outline: 2px solid var(--gray-900); outline-offset: 1px; }
    .cal-cell.today-missed { background: #dc2626; outline: 2px solid var(--gray-900); outline-offset: 1px; }
    .cal-cell.empty  { background: transparent; }

    .weekly-rate {
      margin-top: 10px;
      font-size: 0.75rem;
      color: var(--gray-600);
    }

    .weekly-rate strong { color: var(--primary); }

    /* La carte s'étend en colonne quand le calendrier est ouvert */
    .habit-card { flex-wrap: wrap; align-items: flex-start; }
    .habit-card-top {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
    }

    /* ── Bannière félicitation ── */
    .congrats-banner {
      display: none;
      align-items: center;
      gap: 12px;
      background: #f0fdf4;
      border: 1.5px solid #16a34a;
      border-radius: 14px;
      padding: 16px 20px;
      margin-bottom: 20px;
      max-width: 680px;
      animation: slideIn 0.4s ease;
    }

    .congrats-banner.show { display: flex; }

    .congrats-banner .congrats-icon { font-size: 1.8rem; }

    .congrats-banner .congrats-text { font-size: 0.95rem; font-weight: 600; color: #15803d; }
    .congrats-banner .congrats-sub  { font-size: 0.8rem; color: #16a34a; margin-top: 2px; }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* État vide */
    .empty-state {
      text-align: center;
      padding: 48px 24px;
      color: var(--gray-400);
      max-width: 680px;
    }

    .empty-state .empty-icon { font-size: 2.5rem; margin-bottom: 12px; }
    .empty-state p { font-size: 0.95rem; }
  </style>
</head>
<body>

  <h1>Mes habitudes</h1>
  <p class="page-sub">Construis ta constance, jour après jour.</p>

  <!-- ZONE 1 — Ajouter -->
  <section class="add-section">
    <h2>Nouvelle habitude</h2>
    <div class="add-row">
      <input type="text" id="habitName" placeholder="Ex: Sport, Lecture, Méditation..." maxlength="40" />
      <div class="color-picker" id="colorPicker"></div>
      <button class="btn-add" onclick="addHabit()">Ajouter</button>
    </div>
    <div class="form-error" id="formError"></div>
  </section>

  <!-- ZONE 2 — Liste -->
  <div class="congrats-banner" id="congratsBanner">
    <div class="congrats-icon">🎉</div>
    <div>
      <div class="congrats-text">Toutes les habitudes du jour sont cochées !</div>
      <div class="congrats-sub">Excellent travail — continue comme ça !</div>
    </div>
  </div>
  <div class="summary" id="summary"></div>
  <div id="habitsContainer"></div>

<script>
  // ── Constantes ──
  const LS_HABITS = 'habits_list';
  const LS_LOGS   = 'habit_logs';

  const COLORS = ['#6d28d9', '#db2777', '#d97706', '#16a34a', '#2563eb', '#0891b2', '#dc2626', '#7c3aed'];

  let selectedColor = COLORS[0];

  // ── localStorage ──
  function getHabits() {
    try { return JSON.parse(localStorage.getItem(LS_HABITS) || '[]'); }
    catch { return []; }
  }

  function saveHabits(habits) {
    localStorage.setItem(LS_HABITS, JSON.stringify(habits));
  }

  function getAllLogs() {
    try { return JSON.parse(localStorage.getItem(LS_LOGS) || '{}'); }
    catch { return {}; }
  }

  function getLogs(habitId) {
    return getAllLogs()[habitId] || [];
  }

  function toggleLog(habitId, dateStr) {
    const all = getAllLogs();
    if (!all[habitId]) all[habitId] = [];
    const idx = all[habitId].indexOf(dateStr);
    if (idx === -1) all[habitId].push(dateStr);
    else all[habitId].splice(idx, 1);
    localStorage.setItem(LS_LOGS, JSON.stringify(all));
  }

  function deleteHabitLogs(habitId) {
    const all = getAllLogs();
    delete all[habitId];
    localStorage.setItem(LS_LOGS, JSON.stringify(all));
  }

  // ── Utilitaires ──
  function toDateStr(date) {
    return date.toISOString().slice(0, 10);
  }

  function todayStr() {
    return toDateStr(new Date());
  }

  function uid() {
    return crypto.randomUUID();
  }

  function escapeHTML(str) {
    const d = document.createElement('div');
    d.textContent = String(str);
    return d.innerHTML;
  }

  function safeColor(color) {
    return COLORS.includes(color) ? color : COLORS[0];
  }

  function safeId(id) {
    return String(id).replace(/[^a-z0-9-]/gi, '');
  }

  // ── Sélecteur de couleurs ──
  function renderColorPicker() {
    const el = document.getElementById('colorPicker');
    el.innerHTML = COLORS.map(c => `
      <div class="color-swatch ${c === selectedColor ? 'selected' : ''}"
           style="background:${c}"
           onclick="selectColor('${c}', this)"
           title="${c}">
      </div>
    `).join('');
  }

  function selectColor(color, el) {
    selectedColor = color;
    document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('selected'));
    el.classList.add('selected');
  }

  // ── Ajouter une habitude ──
  function addHabit() {
    const input = document.getElementById('habitName');
    const name = input.value.trim();
    const errorEl = document.getElementById('formError');
    errorEl.textContent = '';

    if (!name) { errorEl.textContent = 'Entrez un nom.'; return; }

    const habits = getHabits();
    if (habits.some(h => h.name.toLowerCase() === name.toLowerCase())) {
      errorEl.textContent = 'Cette habitude existe déjà.';
      return;
    }

    habits.push({ id: uid(), name, color: selectedColor, createdAt: todayStr() });
    saveHabits(habits);
    input.value = '';
    renderHabits();
  }

  // ── Supprimer une habitude ──
  function deleteHabit(id) {
    const habits = getHabits().filter(h => h.id !== id);
    saveHabits(habits);
    deleteHabitLogs(id);
    renderHabits();
  }

  // ── Cocher/décocher aujourd'hui ──
  function toggleToday(id) {
    toggleLog(id, todayStr());
    renderHabits();
    checkAllDone();
  }

  // ── Résumé global ──
  function renderSummary(habits) {
    const today = todayStr();
    const done = habits.filter(h => getLogs(h.id).includes(today)).length;
    const el = document.getElementById('summary');
    if (habits.length === 0) { el.textContent = ''; return; }
    el.innerHTML = `<span>${done}</span> habitude${done > 1 ? 's' : ''} complétée${done > 1 ? 's' : ''} aujourd'hui sur <span>${habits.length}</span>`;
  }

  // ── Afficher les habitudes ──
  function renderHabits() {
    const habits = getHabits();
    const today = todayStr();
    const container = document.getElementById('habitsContainer');

    renderSummary(habits);

    if (habits.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">🌱</div>
          <p>Aucune habitude pour l'instant.<br>Ajoute ta première habitude ci-dessus !</p>
        </div>`;
      return;
    }

    container.innerHTML = `<div class="habits-grid">${habits.map(h => {
      const done   = getLogs(h.id).includes(today);
      const streak = getStreak(h.id);
      const streakText = streak === 0 ? 'Pas encore de streak'
        : streak === 1 ? '🔥 1 jour de suite'
        : `🔥 ${streak} jours de suite`;
      const sid    = safeId(h.id);
      const scolor = safeColor(h.color);
      const sname  = escapeHTML(h.name);
      return `
        <div class="habit-card">
          <div class="habit-card-top">
            <div class="habit-color-dot" style="background:${scolor}"></div>
            <input type="checkbox"
                   class="habit-checkbox"
                   style="--habit-color:${scolor}"
                   ${done ? 'checked' : ''}
                   onchange="toggleToday('${sid}')" />
            <div class="habit-info">
              <div class="habit-name">${sname}</div>
              <div class="habit-streak">${streakText}</div>
            </div>
            <button class="btn-delete" onclick="deleteHabit('${sid}')" title="Supprimer">✕</button>
          </div>
          <button class="calendar-toggle" id="calbtn-${sid}" onclick="toggleCalendar('${sid}','${scolor}')">▼ Voir le calendrier</button>
          <div class="calendar-wrap" id="cal-${sid}"></div>
        </div>`;
    }).join('')}</div>`;
  }

  // ── Streak ──
  function getStreak(habitId) {
    const logs = getLogs(habitId);
    let streak = 0;
    const date = new Date();
    for (let i = 0; i < 3650; i++) {
      const dateStr = toDateStr(date);
      if (logs.includes(dateStr)) {
        streak++;
        date.setDate(date.getDate() - 1);
      } else {
        break;
      }
    }
    return streak;
  }

  // ── Taux hebdomadaire ──
  function getWeeklyRate(habitId) {
    const logs = getLogs(habitId);
    const today = new Date();
    let done = 0, total = 0;
    for (let i = 6; i >= 0; i--) {
      const d = new Date(today);
      d.setDate(today.getDate() - i);
      if (d <= today) {
        total++;
        if (logs.includes(toDateStr(d))) done++;
      }
    }
    return total === 0 ? 0 : Math.round((done / total) * 100);
  }

  // ── Calendrier ──
  function renderCalendar(habitId, color) {
    const safeCol = safeColor(color);
    const habit = getHabits().find(h => safeId(h.id) === safeId(habitId));
    const createdAt = habit ? habit.createdAt : null;
    const today = new Date();
    const year  = today.getFullYear();
    const month = today.getMonth();
    const todayDate = today.getDate();
    const logs = getLogs(habitId);

    const firstDay   = new Date(year, month, 1);
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    // Lundi = 0 (ajustement français)
    const startOffset = (firstDay.getDay() + 6) % 7;

    const monthName = today.toLocaleString('fr-FR', { month: 'long', year: 'numeric' });

    const DAY_LABELS = ['Lu', 'Ma', 'Me', 'Je', 'Ve', 'Sa', 'Di'];
    const headers = DAY_LABELS.map(d => `<div class="cal-day-label">${d}</div>`).join('');

    const emptyCells = Array(startOffset).fill('<div class="cal-cell empty"></div>').join('');

    const cells = Array.from({ length: daysInMonth }, (_, i) => {
      const d = i + 1;
      const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      const isToday = d === todayDate;
      const isPast  = new Date(year, month, d) < new Date(year, month, todayDate);
      const isDone  = logs.includes(dateStr);
      const isBeforeCreation = createdAt && dateStr < createdAt;

      let cls = 'future';
      if (isBeforeCreation) cls = 'future';
      else if (isToday) cls = isDone ? 'today-done' : 'today-missed';
      else if (isPast) cls = isDone ? 'done' : 'missed';

      const bg = (isDone && !isToday && !isBeforeCreation) ? `style="background:${safeCol}"` : '';
      return `<div class="cal-cell ${cls}" ${bg}>${d}</div>`;
    }).join('');

    const rate = getWeeklyRate(habitId);

    return `
      <div class="cal-header">${monthName}</div>
      <div class="cal-grid">${headers}${emptyCells}${cells}</div>
      <div class="weekly-rate">Taux 7 derniers jours : <strong>${rate}%</strong></div>
    `;
  }

  // ── Vérifier si tout est coché ──
  let wasAllDone = false;

  function checkAllDone() {
    const habits = getHabits();
    if (habits.length === 0) return;
    const today = todayStr();
    const allDone = habits.every(h => getLogs(h.id).includes(today));
    const banner = document.getElementById('congratsBanner');

    if (allDone) {
      banner.classList.add('show');
      if (!wasAllDone) {
        confetti({ particleCount: 120, spread: 80, origin: { y: 0.55 } });
        setTimeout(() => confetti({ particleCount: 60, spread: 100, origin: { y: 0.5, x: 0.2 } }), 300);
        setTimeout(() => confetti({ particleCount: 60, spread: 100, origin: { y: 0.5, x: 0.8 } }), 500);
      }
      wasAllDone = true;
    } else {
      banner.classList.remove('show');
      wasAllDone = false;
    }
  }

  // ── Toggle calendrier ──
  function toggleCalendar(id, color) {
    const wrap = document.getElementById('cal-' + id);
    if (!wrap) return;
    const isOpen = wrap.classList.contains('open');
    if (!isOpen) wrap.innerHTML = renderCalendar(id, color);
    wrap.classList.toggle('open');
    const btn = document.getElementById('calbtn-' + id);
    if (btn) btn.textContent = wrap.classList.contains('open') ? '▲ Masquer le calendrier' : '▼ Voir le calendrier';
  }

  // ── Entrée clavier ──
  document.getElementById('habitName').addEventListener('keydown', e => {
    if (e.key === 'Enter') addHabit();
  });

  // ── Init ──
  renderColorPicker();
  renderHabits();
  checkAllDone();
</script>
</body>
</html>
